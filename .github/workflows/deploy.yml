name: Deploy to InfinityFree

# Runs every time you push to the main branch.
# First run: uploads the whole site.
# Later runs: only the files you actually changed are uploaded.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Upload changed files to InfinityFree
    runs-on: ubuntu-latest

    steps:
      - name: Get the latest code
        uses: actions/checkout@v4

      - name: Upload only changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          # InfinityFree does not accept FTPS (explicit TLS) on its FTP
          # host. Plain FTP over port 21 is what their file manager and
          # FileZilla use here, so the upload actually lands in htdocs.
          protocol: ftp
          # Target folder on the InfinityFree server.
          # Change this one value if the remote folder is different.
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Keeps a small marker file on the server so the action knows
          # which files changed since last time. This is what makes it
          # upload ONLY the changed files after the first run.
          # v2 (was v1): the v1 marker was written during the first run,
          # before the earlier manual upload, so later changes were
          # skipped. A new marker name makes the next run re-upload
          # every file once and then resume normal changed-only sync.
          state-name: .ftp-deploy-sync-state-v2.json
          log-level: verbose
